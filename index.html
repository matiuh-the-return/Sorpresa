<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>¿Quieres ser mi novia otra vez?</title>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      text-align: center;
      margin-top: 10%;
      background-color: #ffe6f0;
    }
    h1 {
      font-size: 2.5rem;
      color: #d63384;
    }
    button {
      padding: 15px 25px;
      font-size: 1.2rem;
      margin: 20px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: 0.2s ease;
    }
    #yesBtn {
      background-color: #28a745;
      color: white;
    }
    #noBtn {
      background-color: #dc3545;
      color: white;
      position: absolute;
    }
  </style>
</head>
<body>
  <h1>¿Quieres ser mi novia otra vez?</h1>
  <button id="yesBtn">Sí</button>
  <button id="noBtn">No</button>

  <script>
    const noBtn = document.getElementById('noBtn');
    const yesBtn = document.getElementById('yesBtn');
    let evasions = 0;

    noBtn.addEventListener('mouseover', () => {
      evasions++;
      if (evasions >= 5) {
        noBtn.innerText = 'Sí';
        noBtn.style.backgroundColor = '#28a745';
      }
      const x = Math.random() * (window.innerWidth - 100);
      const y = Math.random() * (window.innerHeight - 50);
      noBtn.style.left = `${x}px`;
      noBtn.style.top = `${y}px`;
    });

    yesBtn.addEventListener('click', () => {
      window.location.href = 'https://www.youtube.com/watch?v=dQw4w9WgXcQ'; // Puedes cambiar este link al video que quieras
    });

    noBtn.addEventListener('click', () => {
      if (noBtn.innerText === 'Sí') {
        yesBtn.click();
      }
    });
  </script>
</body>
</html>
