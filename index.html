<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>¿Quieres ser mi novia otra vez?</title>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      text-align: center;
      margin-top: 10%;
      background-color: #ffe6f0;
    }
    h1 {
      font-size: 2.5rem;
      color: #d63384;
    }
    .btn {
      padding: 15px 25px;
      font-size: 1.2rem;
      margin: 20px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: 0.2s ease;
    }
    #yesBtn {
      background-color: #28a745;
      color: white;
    }
    #noBtn {
      background-color: #dc3545;
      color: white;
      position: absolute;
    }
    #buttonContainer {
      position: relative;
      display: inline-block;
    }
    #msg {
      color: #ff0033;
      font-size: 1.5rem;
      margin-bottom: 10px;
      display: none;
      position: absolute;
      top: -40px;
      left: 50%;
      transform: translateX(-50%);
      animation: shake 0.5s infinite alternate;
    }
    @keyframes shake {
      from { transform: translateX(-50%) rotate(-3deg); }
      to { transform: translateX(-50%) rotate(3deg); }
    }
  </style>
</head>
<body>
  <h1>¿Quieres ser mi novia otra vez?</h1>
  <div id="buttonContainer">
    <div id="msg">¡ME LARGO!</div>
    <button class="btn" id="yesBtn">Sí</button>
    <button class="btn" id="noBtn">No</button>
  </div>

  <script>
    const noBtn = document.getElementById('noBtn');
    const yesBtn = document.getElementById('yesBtn');
    const msg = document.getElementById('msg');

    let evasions = 0;

    noBtn.addEventListener('mouseover', () => {
      evasions++;

      if (evasions < 5) {
        const x = Math.random() * (window.innerWidth - 100);
        const y = Math.random() * (window.innerHeight - 50);
        noBtn.style.left = `${x}px`;
        noBtn.style.top = `${y}px`;
      } else if (evasions === 5) {
        // Mostrar mensaje y desaparecer botón
        msg.style.display = 'block';
        setTimeout(() => {
          noBtn.style.display = 'none';
          msg.style.animation = 'none';
          msg.innerText = '...Y se fue 😔';
          setTimeout(() => {
            msg.style.display = 'none';
          }, 2000);
        }, 1500);
      }
    });

    yesBtn.addEventListener('click', () => {
      window.location.href = 'https://youtu.be/0W6cY8rGWCo?si=Xi5qWY3fd5BymtP6 ; // Cámbialo si quieres
    });
  </script>
</body>
</html>
