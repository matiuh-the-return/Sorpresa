<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>¿Quieres ser mi novia otra vez?</title>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      text-align: center;
      margin-top: 10%;
      background-color: #ffe6f0;
    }
    h1 {
      font-size: 2.5rem;
      color: #d63384;
    }
    .btn {
      padding: 15px 25px;
      font-size: 1.2rem;
      margin: 20px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: 0.2s ease;
    }
    #yesBtn {
      background-color: #28a745;
      color: white;
    }
    #noBtn {
      background-color: #dc3545;
      color: white;
      position: absolute;
    }
    #buttonContainer {
      position: relative;
      display: inline-block;
    }
  </style>
</head>
<body>
  <h1>¿Quieres ser mi novia otra vez?</h1>
  <div id="buttonContainer">
    <button class="btn" id="yesBtn">Sí</button>
    <button class="btn" id="noBtn">No</button>
  </div>

  <script>
    const noBtn = document.getElementById('noBtn');
    const yesBtn = document.getElementById('yesBtn');
    const container = document.getElementById('buttonContainer');
    let evasions = 0;
    let originalPositionSet = false;
    let originalX = 0;
    let originalY = 0;

    window.onload = () => {
      // Guardar posición inicial del botón "No"
      const rect = noBtn.getBoundingClientRect();
      originalX = rect.left;
      originalY = rect.top;
    };

    noBtn.addEventListener('mouseover', () => {
      if (evasions < 5) {
        evasions++;

        const x = Math.random() * (window.innerWidth - 100);
        const y = Math.random() * (window.innerHeight - 50);
        noBtn.style.left = `${x}px`;
        noBtn.style.top = `${y}px`;

        if (evasions === 5) {
          // Cambiar texto y volver a posición original
          noBtn.innerText = 'Sí';
          noBtn.style.backgroundColor = '#28a745';
          const yesRect = yesBtn.getBoundingClientRect();
          noBtn.style.left = `${yesRect.right + 10}px`;
          noBtn.style.top = `${yesRect.top}px`;
        }
      }
    });

    yesBtn.addEventListener('click', () => {
      window.location.href = 'https://www.youtube.com/watch?v=dQw4w9WgXcQ'; // cámbialo por el video que quieras
    });

    noBtn.addEventListener('click', () => {
      if (noBtn.innerText === 'Sí') {
        yesBtn.click();
      }
    });
  </script>
</body>
</html>
