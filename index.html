<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>¿Quieres ser mi novia otra vez?</title>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      text-align: center;
      margin-top: 10%;
      background-color: #ffe6f0;
    }
    h1 {
      font-size: 2.5rem;
      color: #d63384;
    }
    .btn {
      padding: 15px 25px;
      font-size: 1.2rem;
      margin: 20px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: 0.2s ease;
    }
    #yesBtn {
      background-color: #28a745;
      color: white;
    }
    #noBtn {
      background-color: #dc3545;
      color: white;
      position: absolute;
    }
    #buttonContainer {
      position: relative;
      display: inline-block;
    }
    #rageText {
      font-size: 1.5rem;
      font-weight: bold;
      color: #ff0033;
      position: absolute;
      display: none;
      animation: rageFade 2s ease forwards;
    }
    @keyframes rageFade {
      0% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(-50px); }
    }
  </style>
</head>
<body>
  <h1>¿Quieres ser mi novia otra vez?</h1>
  <div id="buttonContainer">
    <button class="btn" id="yesBtn">Sí</button>
    <button class="btn" id="noBtn">No</button>
    <div id="rageText">¡ME LARGO!!!</div>
  </div>

  <script>
    const noBtn = document.getElementById('noBtn');
    const yesBtn = document.getElementById('yesBtn');
    const rageText = document.getElementById('rageText');
    let evasions = 0;

    noBtn.addEventListener('mouseover', () => {
      evasions++;
      if (evasions < 5) {
        const x = Math.random() * (window.innerWidth - 100);
        const y = Math.random() * (window.innerHeight - 50);
        noBtn.style.left = `${x}px`;
        noBtn.style.top = `${y}px`;
      } else if (evasions === 5) {
        const rect = noBtn.getBoundingClientRect();
        rageText.style.left = `${rect.left}px`;
        rageText.style.top = `${rect.top - 40}px`;
        rageText.style.display = 'block';

        setTimeout(() => {
          noBtn.style.display = 'none';
        }, 500); // Desaparece el botón "No" poco después del texto
      }
    });

    yesBtn.addEventListener('click', () => {
      window.location.href = 'https://www.youtube.com/watch?v=dQw4w9WgXcQ'; // cámbialo por tu video especial
    });
  </script>
</body>
</html>
